# NetForge edge (Mac 2), Phase 2 config.
# Live path: /opt/homebrew/etc/nginx/nginx.conf
# Changes from Phase 1 (nginx.conf in this folder):
#   - passive health checks on each upstream (max_fails / fail_timeout)
#   - fast failover: short connect timeout and a retry on the other backend
#   - X-Edge header to show which edge served the request (used in Extension E)
#   - access log that records which backend each request was sent to

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # One line per request: client, request, final status, and every backend tried.
    # If a backend is down, $upstream_addr lists both ("A, B") and $upstream_status shows "502, 200".
    log_format netforge '$time_local client=$remote_addr "$request" status=$status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'upstream_time=$upstream_response_time';
    access_log /opt/homebrew/var/log/nginx/netforge_upstream.log netforge;

    upstream backend_servers {
        # Round robin. If one connection attempt fails (max_fails=1), nginx marks that
        # backend down for 10 s (fail_timeout), then tries it again.
        # This is passive health checking: nginx learns a backend is down from real requests.
        server 10.7.28.81:3001 max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
        server 10.7.3.10:3002  max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
    }

    server {
        listen 80;
        server_name app.netforge.test api.netforge.test;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8443 ssl;
        server_name app.netforge.test api.netforge.test;

        ssl_certificate     /Users/alishagupta/netforge-certs/app.netforge.test.pem;
        ssl_certificate_key /Users/alishagupta/netforge-certs/app.netforge.test-key.pem;

        location / {
            proxy_pass http://backend_servers;

            # Failover: if a backend refuses the connection, times out, or returns a 5xx,
            # retry the request once on the other backend, so the client still gets a 200.
            proxy_connect_timeout 2s;      # a powered-off Mac never sends a RST; give up after 2 s, not 60 s
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header Cache-Control "public, max-age=60";
            add_header X-Edge "primary-mac2" always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
