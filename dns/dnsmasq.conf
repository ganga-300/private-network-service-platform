# NetForge private DNS (dnsmasq on Mac 1)
# Source: /opt/homebrew/etc/dnsmasq.conf (comments stripped, explanations added)

# Resolve our private .test names to the nginx edge server (Mac 2).
# DNS only returns the IP. The TCP/TLS connection to that IP is a separate step.
address=/app.netforge.test/10.7.18.238
address=/api.netforge.test/10.7.18.238

# Listen on localhost (for tests on this Mac) and on the LAN IP (for other Macs).
listen-address=127.0.0.1,10.7.15.247

# Bind only to the addresses above, not to every interface.
bind-interfaces

# Standard DNS port (UDP/TCP 53).
port=53
