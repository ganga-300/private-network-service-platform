# NetForge private DNS (dnsmasq on Mac 1)
# Source: /opt/homebrew/etc/dnsmasq.conf (comments stripped, explanations added)

# Resolve our private .test names to the nginx edge server (Mac 2).
# DNS only returns the IP. The TCP/TLS connection to that IP is a separate step.
address=/app.netforge.test/10.7.17.248
address=/api.netforge.test/10.7.17.248

# Listen on localhost (for tests on this Mac) and on the LAN IP (for other Macs).
listen-address=127.0.0.1,10.7.15.247
interface=en0

# Bind only to the addresses above, not to every interface.
bind-interfaces

# Standard DNS port (UDP/TCP 53).
port=53

# Forward every name that is not a .test record to public DNS, so clients
# using this server keep normal internet access. no-resolv avoids a loop,
# because the Mac's own resolver points back at dnsmasq.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Phase 2 (Extension B): answers for our own records carry a 30 s TTL.
# dnsmasq's default local-ttl is 0, so in Phase 1 clients never cached them.
local-ttl=30
