# NetForge BACKUP DNS (dnsmasq on Mac 4), Phase 2 Extension A
# Live path: /opt/homebrew/etc/dnsmasq.conf on Mac 4
# Same records as the primary (Mac 1). Clients list Mac 1 first and Mac 4 second.
# If Mac 1 stops answering, the client resolver retries the query here.

address=/app.netforge.test/10.7.17.248
address=/api.netforge.test/10.7.17.248

# Listen on localhost and Mac 4's LAN IP only.
listen-address=127.0.0.1,10.7.3.10
interface=en0
bind-interfaces
port=53

# Forward non-.test names to public DNS, so the backup also keeps clients online.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Same 30 s TTL as the primary (Extension B).
local-ttl=30
